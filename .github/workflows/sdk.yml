# Regenerates the client SDKs from spec/swagger.json with scripts/update-sdks.ps1.
#
# - pull_request: fails if the committed clients differ from what the spec generates
#   (hand edits to generated code, or a spec change committed without regenerating).
# - push to main / manual run: regenerates and opens a pull request with the result.
#
# The service repository is not reachable from here, so the spec is refreshed locally:
#   .\scripts\export-spec.ps1      # then commit spec/swagger.json
name: SDKs

on:
  pull_request:
    paths:
      - 'spec/**'
      - 'codegen/**'
      - 'scripts/**'
      - '*-client/**'
      - '*-cLient/**'
      - '.github/workflows/sdk.yml'
  push:
    branches: [main]
    paths:
      - 'spec/**'
      - 'codegen/**'
      - 'scripts/**'
      - '*-client/**'
      - '*-cLient/**'
      - '.github/workflows/sdk.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to write into the clients (empty: keep codegen/*.json values)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache codegen jar
        uses: actions/cache@v4
        with:
          path: tools
          key: tools-${{ hashFiles('codegen/codegen.json') }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('*-client/gradle/wrapper/gradle-wrapper.properties', '*-client/build.gradle') }}

      - name: Regenerate and verify clients
        shell: powershell
        env:
          SDK_VERSION: ${{ github.event.inputs.version }}
        run: |
          $params = @{ SkipExport = $true }
          if ($env:SDK_VERSION) { $params.Version = $env:SDK_VERSION }
          .\scripts\update-sdks.ps1 @params
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Check generated code is up to date
        if: github.event_name == 'pull_request'
        shell: powershell
        run: |
          $changes = git status --porcelain
          if ($changes) {
            $changes | Select-Object -First 50
            Write-Host "::error::Generated clients are out of date with spec/swagger.json. Run .\scripts\update-sdks.ps1 -SkipExport and commit the result. Hand edits belong in .swagger-codegen-ignore or scripts/postprocess/."
            exit 1
          }

      - name: Open pull request
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: sdk/regenerate
          delete-branch: true
          commit-message: Regenerate client SDKs from spec/swagger.json
          title: Regenerate client SDKs
          body: |
            Clients regenerated by `scripts/update-sdks.ps1` from `spec/swagger.json` (run ${{ github.run_id }}).
            All endpoints are present and the clients build.
